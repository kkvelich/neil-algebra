<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Module 6 Sample Test A — Polynomial Operations</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}:root{--bg:#0F172A;--bg-card:#1E293B;--bg-elevated:#334155;--text:#F1F5F9;--text-dim:#94A3B8;--primary:#14B8A6;--primary-2:#2563EB;--green:#10B981;--green-soft:rgba(16,185,129,0.18);--red:#EF4444;--red-soft:rgba(239,68,68,0.18);--border:#334155;}@media (prefers-color-scheme:light){:root{--bg:#F8FAFC;--bg-card:#FFFFFF;--bg-elevated:#F1F5F9;--text:#1A1A1A;--text-dim:#64748B;--border:#E2E8F0;}}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;}.container{max-width:760px;margin:0 auto;padding:1rem 1.1rem 4rem;}header.top{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1rem;}.logo{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#14B8A6,#2563EB);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}.back{color:var(--text-dim);text-decoration:none;font-size:0.88rem;font-weight:600;}.hero{background:linear-gradient(135deg,#14B8A6,#2563EB);border-radius:18px;padding:1.2rem 1.3rem;color:white;margin-bottom:1.3rem;}.hero h1{margin:0 0 0.3rem;font-size:1.3rem;font-weight:800;}.hero p{margin:0;font-size:0.92rem;opacity:0.95;line-height:1.55;}.hero .tags{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap;}.hero .tag{background:rgba(255,255,255,0.22);padding:0.25rem 0.7rem;border-radius:999px;font-weight:700;font-size:0.78rem;}.score-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:0.85rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;}.score-bar .label{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;}.score-bar .progress-num{font-size:1.4rem;font-weight:800;color:var(--primary);}.q-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:1rem;}.q-card.correct{border-color:var(--green);background:linear-gradient(180deg,var(--green-soft),var(--bg-card));}.q-card.wrong{border-color:var(--red);background:linear-gradient(180deg,var(--red-soft),var(--bg-card));}.q-num{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;margin-bottom:0.3rem;}.skill-tag{display:inline-block;font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;background:rgba(20,184,166,0.18);color:var(--primary);padding:0.1rem 0.45rem;border-radius:4px;margin-left:0.4rem;}.q-text{font-size:1.04rem;font-weight:600;margin-bottom:0.7rem;line-height:1.55;}.q-text sup,.choice sup,.solution sup{font-size:0.72em;}.choices{display:flex;flex-direction:column;gap:0.45rem;}.choice{display:flex;align-items:flex-start;gap:0.65rem;background:var(--bg-elevated);border:2px solid transparent;border-radius:10px;padding:0.7rem 0.9rem;cursor:pointer;font-size:0.95rem;line-height:1.5;transition:all 0.15s;}.choice:hover{border-color:var(--primary);}.choice input{margin-top:0.3rem;cursor:pointer;flex-shrink:0;accent-color:var(--primary);}.choice .letter{font-weight:800;color:var(--text-dim);margin-right:0.2rem;}.choice.selected{border-color:var(--primary);background:rgba(20,184,166,0.12);}.choice.disabled{cursor:not-allowed;opacity:0.85;}.choice.disabled.selected{border-color:var(--primary);}.choice.show-correct{border-color:var(--green);background:var(--green-soft);}.choice.show-wrong{border-color:var(--red);background:var(--red-soft);}.solution{margin-top:0.7rem;padding:0.75rem 1rem;background:var(--bg-elevated);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-size:0.9rem;line-height:1.55;}.solution .sol-head{font-weight:800;color:var(--primary);margin-bottom:0.25rem;}.bottom-bar{display:flex;gap:0.55rem;margin-top:1.5rem;}.btn{flex:1;border:none;border-radius:12px;cursor:pointer;font-family:inherit;padding:0.95rem;font-size:1rem;font-weight:800;}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;}.btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}.btn:disabled{opacity:0.5;cursor:not-allowed;}.result-banner{background:linear-gradient(135deg,rgba(20,184,166,0.15),rgba(37,99,235,0.1));border:1px solid var(--primary);border-radius:14px;padding:1.1rem 1.3rem;margin:1.5rem 0;}.result-banner.pass{background:linear-gradient(135deg,rgba(16,185,129,0.18),rgba(37,99,235,0.1));border-color:var(--green);}.result-banner.fail{background:linear-gradient(135deg,rgba(239,68,68,0.18),rgba(245,158,11,0.1));border-color:var(--red);}.result-banner h2{margin:0 0 0.3rem;font-size:1.3rem;color:var(--primary);}.result-banner.pass h2{color:var(--green);} .result-banner.fail h2{color:var(--red);}.result-banner .big-score{font-size:3rem;font-weight:900;margin:0.3rem 0;line-height:1;}.result-banner.pass .big-score{color:var(--green);} .result-banner.fail .big-score{color:var(--red);}footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);text-align:center;font-size:0.83rem;color:var(--text-dim);}footer a{color:var(--primary);text-decoration:none;}</style>
</head><body><div class="container">
<header class="top"><a class="logo" href="index.html">🧮 Mod 6 Test A</a><a class="back" href="index.html">← Hub</a></header>
<div class="hero"><h1>Module 6 Sample Test A — Polynomial Operations</h1><p>15-question mock test covering 6.01–6.05. Aim 12+/15.</p><div class="tags"><span class="tag">15 MC</span><span class="tag">~25 min</span><span class="tag">Final prep</span></div></div>
<div class="score-bar"><div><div class="label">Selected</div><div class="progress-num"><span id="selectedCount">0</span> / 15</div></div><div style="text-align:right;"><div class="label">Status</div><div id="quizStatus" style="font-size:0.9rem;font-weight:700;">In progress</div></div></div>
<div id="quiz"></div>
<div class="bottom-bar"><button class="btn btn-secondary" onclick="resetQuiz()">🔄 Reset</button><button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()" disabled>Submit all</button></div>
<footer><p><a href="sample-test-6b.html">Test B →</a> · <a href="module-6-crash-course.html">Crash Course</a> · <a href="index.html">Hub</a></p></footer>
</div>
<script>
const QUESTIONS = [
  { skill:"Classify", q:`<p>Classify <code>7x<sup>2</sup> + 3x − 5</code> by degree and number of terms.</p>`, choices:["Quadratic trinomial", "Cubic trinomial", "Quadratic binomial", "Linear trinomial"], ans:0, sol:"Highest power = 2 (quadratic). 3 terms → trinomial." },
  { skill:"Standard form", q:`<p>Write in standard form: <code>x + 4x<sup>4</sup> − 3x<sup>2</sup></code></p>`, choices:["x + 4x<sup>4</sup> − 3x<sup>2</sup>", "4x<sup>4</sup> − 3x<sup>2</sup> + x", "−3x<sup>2</sup> + x + 4x<sup>4</sup>", "4x<sup>4</sup> + x − 3x<sup>2</sup>"], ans:1, sol:"Descending degree order: 4, 2, 1 → 4x<sup>4</sup> − 3x<sup>2</sup> + x." },
  { skill:"Sum", q:`<p>Simplify: <code>(2x<sup>2</sup> + 5x − 1) + (3x<sup>2</sup> − 2x + 4)</code></p>`, choices:["5x<sup>2</sup> + 7x + 3", "5x<sup>2</sup> + 7x + 5", "5x<sup>2</sup> + 3x + 3", "5x<sup>2</sup> + 3x − 5"], ans:2, sol:"x²: 2+3 = 5. x: 5−2 = 3. Const: −1+4 = 3." },
  { skill:"Difference", q:`<p>Simplify: <code>(4x<sup>2</sup> − x + 6) − (x<sup>2</sup> + 3x − 2)</code></p>`, choices:["3x<sup>2</sup> + 2x + 4", "3x<sup>2</sup> + 2x + 8", "5x<sup>2</sup> − 4x + 4", "3x<sup>2</sup> − 4x + 8"], ans:3, sol:"Distribute minus: 4x² − x + 6 − x² − 3x + 2. x²: 4−1=3; x: −1−3=−4; const: 6+2=8." },
  { skill:"Closure", q:`<p>The expression <code>(3x + 1) − (x<sup>2</sup> + 2x)</code> equals <code>−x<sup>2</sup> + x + 1</code>. Is the result a polynomial?</p>`, choices:["Yes — closure under subtraction always gives a polynomial", "No — only addition is closed", "It depends on the values of x", "Only if x &gt; 0"], ans:0, sol:"Polynomials are closed under both addition AND subtraction. The result is always a polynomial." },
  { skill:"Product rule", q:`<p>Simplify: <code>(3x<sup>2</sup>y)(4xy<sup>3</sup>)</code></p>`, choices:["7x<sup>3</sup>y<sup>4</sup>", "12x<sup>3</sup>y<sup>4</sup>", "12x<sup>2</sup>y<sup>3</sup>", "7x<sup>2</sup>y<sup>4</sup>"], ans:1, sol:"Multiply coefficients 3·4 = 12. Add exponents: x²·x = x³; y·y³ = y⁴." },
  { skill:"Power of a product", q:`<p>Simplify: <code>(2x<sup>3</sup>y)<sup>2</sup></code></p>`, choices:["2x<sup>6</sup>y<sup>2</sup>", "4x<sup>5</sup>y", "4x<sup>6</sup>y<sup>2</sup>", "2x<sup>5</sup>y"], ans:2, sol:"Apply 2 to each: 2² = 4, (x³)² = x⁶, y² = y². ⚠ Don't forget the coefficient gets squared too." },
  { skill:"Quotient rule", q:`<p>Simplify: <code>x<sup>5</sup>y<sup>3</sup> / (x<sup>2</sup>y)</code></p>`, choices:["x<sup>7</sup>y<sup>4</sup>", "x<sup>3</sup>y<sup>3</sup>", "x<sup>5</sup>y<sup>2</sup>", "x<sup>3</sup>y<sup>2</sup>"], ans:3, sol:"Subtract exponents per base: x^(5−2) = x³; y^(3−1) = y²." },
  { skill:"Negative exponent", q:`<p>Simplify: <code>5 / x<sup>−2</sup></code></p>`, choices:["5x<sup>2</sup>", "5/x<sup>2</sup>", "−5x<sup>2</sup>", "x<sup>2</sup>/5"], ans:0, sol:"Negative exponent in denominator → move up, sign flips: 5 · x² = 5x²." },
  { skill:"Distribute monomial", q:`<p>Simplify: <code>−3x(2x<sup>2</sup> − x + 4)</code></p>`, choices:["−6x<sup>3</sup> − 3x<sup>2</sup> − 12x", "−6x<sup>3</sup> + 3x<sup>2</sup> − 12x", "6x<sup>3</sup> − 3x<sup>2</sup> + 12x", "−6x<sup>3</sup> + 3x<sup>2</sup> + 12x"], ans:1, sol:"−3x · 2x² = −6x³; −3x · (−x) = +3x²; −3x · 4 = −12x." },
  { skill:"FOIL", q:`<p>Multiply: <code>(x + 5)(x − 3)</code></p>`, choices:["x<sup>2</sup> + 8x − 15", "x<sup>2</sup> − 2x − 15", "x<sup>2</sup> + 2x − 15", "x<sup>2</sup> + 2x + 15"], ans:2, sol:"FOIL: x² + (−3x + 5x) + (−15) = x² + 2x − 15." },
  { skill:"Perfect square", q:`<p>Expand: <code>(x − 4)<sup>2</sup></code></p>`, choices:["x<sup>2</sup> − 16", "x<sup>2</sup> + 16", "x<sup>2</sup> + 8x + 16", "x<sup>2</sup> − 8x + 16"], ans:3, sol:"(a − b)² = a² − 2ab + b² = x² − 8x + 16. ⚠ Keep the middle −8x term." },
  { skill:"Diff of squares", q:`<p>Multiply: <code>(3x + 2)(3x − 2)</code></p>`, choices:["9x<sup>2</sup> − 4", "9x<sup>2</sup> + 4", "9x<sup>2</sup> − 12x + 4", "6x<sup>2</sup> − 4"], ans:0, sol:"Diff of squares: (3x)² − 2² = 9x² − 4." },
  { skill:"Composite numeric", q:`<p>f(x) = x + 1, g(x) = x<sup>2</sup>. Find f(g(2)).</p>`, choices:["3", "5", "9", "4"], ans:1, sol:"g(2) = 4. f(4) = 4 + 1 = 5." },
  { skill:"Composite algebraic", q:`<p>f(x) = 2x + 3, g(x) = x − 1. Find f(g(x)).</p>`, choices:["2x + 3", "2x − 1", "2x + 1", "2x + 5"], ans:2, sol:"f(g(x)) = f(x − 1) = 2(x − 1) + 3 = 2x − 2 + 3 = 2x + 1." }
];
let userAnswers = new Array(QUESTIONS.length).fill(null);let submitted = false;
function render(){const e=document.getElementById('quiz');let h='';QUESTIONS.forEach((q,i)=>{let c='q-card';if(submitted)c+=userAnswers[i]===q.ans?' correct':' wrong';h+=`<div class="${c}"><div class="q-num">Question ${i+1} of ${QUESTIONS.length}<span class="skill-tag">${q.skill}</span></div><div class="q-text">${q.q}</div><div class="choices">`;q.choices.forEach((ch,j)=>{let cc='choice';if(submitted){cc+=' disabled';if(j===q.ans)cc+=' show-correct';else if(userAnswers[i]===j)cc+=' show-wrong';}else if(userAnswers[i]===j)cc+=' selected';h+=`<label class="${cc}"><input type="radio" name="q${i}" value="${j}" ${userAnswers[i]===j?'checked':''} ${submitted?'disabled':''} onchange="selectAnswer(${i},${j})"><span><span class="letter">${'ABCD'[j]}.</span> ${ch}</span></label>`;});h+=`</div>`;if(submitted)h+=`<div class="solution"><div class="sol-head">${userAnswers[i]===q.ans?'✓ Correct':'✗ Correct answer: '+'ABCD'[q.ans]}</div>${q.sol}</div>`;h+=`</div>`;});e.innerHTML=h;updateScoreBar();}
function updateScoreBar(){const s=userAnswers.filter(a=>a!==null).length;document.getElementById('selectedCount').textContent=s;document.getElementById('quizStatus').textContent=submitted?'Submitted':(s===QUESTIONS.length?'Ready to submit':'In progress');document.getElementById('submitBtn').disabled=submitted||s<QUESTIONS.length;}
function selectAnswer(i,j){if(submitted)return;userAnswers[i]=j;render();}
function submitQuiz(){if(submitted)return;if(userAnswers.includes(null)&&!confirm("You haven't answered every question. Submit anyway?"))return;submitted=true;render();showResults();}
function showResults(){const c=userAnswers.filter((a,i)=>a===QUESTIONS[i].ans).length;const t=QUESTIONS.length;const p=Math.round(c/t*100);const pass=p>=80;const b=document.createElement('div');b.className='result-banner '+(pass?'pass':'fail');b.innerHTML=`<h2>${pass?'🎯 Ready for the final':'📚 Keep drilling'}</h2><div class="big-score">${c} / ${t} <span style="font-size:1.5rem;">(${p}%)</span></div>`;document.querySelector('.score-bar').after(b);window.scrollTo({top:b.offsetTop-20,behavior:'smooth'});}
function resetQuiz(){if(!confirm("Clear answers and start over?"))return;userAnswers=new Array(QUESTIONS.length).fill(null);submitted=false;document.querySelectorAll('.result-banner').forEach(e=>e.remove());render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script></body></html>
