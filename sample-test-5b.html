<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Module 5 Sample Test B — Statistics</title>
<style>*{box-sizing:border-box;}:root{--bg:#0F172A;--bg-card:#1E293B;--bg-elevated:#334155;--text:#F1F5F9;--text-dim:#94A3B8;--primary:#3B82F6;--primary-2:#06B6D4;--green:#10B981;--green-soft:rgba(16,185,129,0.18);--red:#EF4444;--red-soft:rgba(239,68,68,0.18);--border:#334155;}@media (prefers-color-scheme:light){:root{--bg:#F8FAFC;--bg-card:#FFFFFF;--bg-elevated:#F1F5F9;--text:#1A1A1A;--text-dim:#64748B;--border:#E2E8F0;}}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;}.container{max-width:760px;margin:0 auto;padding:1rem 1.1rem 4rem;}header.top{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1rem;}.logo{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#3B82F6,#06B6D4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}.back{color:var(--text-dim);text-decoration:none;font-size:0.88rem;font-weight:600;}.hero{background:linear-gradient(135deg,#3B82F6,#06B6D4);border-radius:18px;padding:1.2rem 1.3rem;color:white;margin-bottom:1.3rem;}.hero h1{margin:0 0 0.3rem;font-size:1.3rem;font-weight:800;}.hero p{margin:0;font-size:0.92rem;opacity:0.95;line-height:1.55;}.hero .tags{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap;}.hero .tag{background:rgba(255,255,255,0.22);padding:0.25rem 0.7rem;border-radius:999px;font-weight:700;font-size:0.78rem;}.score-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:0.85rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;}.score-bar .label{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;}.score-bar .progress-num{font-size:1.4rem;font-weight:800;color:var(--primary);}.q-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:1rem;}.q-card.correct{border-color:var(--green);background:linear-gradient(180deg,var(--green-soft),var(--bg-card));}.q-card.wrong{border-color:var(--red);background:linear-gradient(180deg,var(--red-soft),var(--bg-card));}.q-num{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;margin-bottom:0.3rem;}.skill-tag{display:inline-block;font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;background:rgba(59,130,246,0.18);color:var(--primary);padding:0.1rem 0.45rem;border-radius:4px;margin-left:0.4rem;}.q-text{font-size:1.04rem;font-weight:600;margin-bottom:0.7rem;line-height:1.55;}.q-text sup,.choice sup,.solution sup{font-size:0.72em;}.choices{display:flex;flex-direction:column;gap:0.45rem;}.choice{display:flex;align-items:flex-start;gap:0.65rem;background:var(--bg-elevated);border:2px solid transparent;border-radius:10px;padding:0.7rem 0.9rem;cursor:pointer;font-size:0.95rem;line-height:1.5;}.choice:hover{border-color:var(--primary);}.choice input{margin-top:0.3rem;accent-color:var(--primary);}.choice .letter{font-weight:800;color:var(--text-dim);margin-right:0.2rem;}.choice.selected{border-color:var(--primary);background:rgba(59,130,246,0.12);}.choice.disabled{cursor:not-allowed;opacity:0.85;}.choice.disabled.selected{border-color:var(--primary);}.choice.show-correct{border-color:var(--green);background:var(--green-soft);}.choice.show-wrong{border-color:var(--red);background:var(--red-soft);}.solution{margin-top:0.7rem;padding:0.75rem 1rem;background:var(--bg-elevated);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-size:0.9rem;line-height:1.55;}.solution .sol-head{font-weight:800;color:var(--primary);margin-bottom:0.25rem;}.bottom-bar{display:flex;gap:0.55rem;margin-top:1.5rem;}.btn{flex:1;border:none;border-radius:12px;cursor:pointer;font-family:inherit;padding:0.95rem;font-size:1rem;font-weight:800;}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;}.btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}.btn:disabled{opacity:0.5;cursor:not-allowed;}.result-banner{background:linear-gradient(135deg,rgba(59,130,246,0.15),rgba(6,182,212,0.1));border:1px solid var(--primary);border-radius:14px;padding:1.1rem 1.3rem;margin:1.5rem 0;}.result-banner.pass{background:linear-gradient(135deg,rgba(16,185,129,0.18),rgba(6,182,212,0.1));border-color:var(--green);}.result-banner.fail{background:linear-gradient(135deg,rgba(239,68,68,0.18),rgba(245,158,11,0.1));border-color:var(--red);}.result-banner h2{margin:0 0 0.3rem;font-size:1.3rem;color:var(--primary);}.result-banner.pass h2{color:var(--green);}.result-banner.fail h2{color:var(--red);}.result-banner .big-score{font-size:3rem;font-weight:900;margin:0.3rem 0;line-height:1;}.result-banner.pass .big-score{color:var(--green);}.result-banner.fail .big-score{color:var(--red);}footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);text-align:center;font-size:0.83rem;color:var(--text-dim);}footer a{color:var(--primary);text-decoration:none;}</style>
</head><body><div class="container">
<header class="top"><a class="logo" href="index.html">📊 Mod 5 Test B</a><a class="back" href="index.html">← Hub</a></header>
<div class="hero"><h1>Module 5 Sample Test B — Statistics</h1><p>Second mock test on Module 5 (5.01–5.07).</p><div class="tags"><span class="tag">15 MC</span><span class="tag">~25 min</span><span class="tag">Final prep</span></div></div>
<div class="score-bar"><div><div class="label">Selected</div><div class="progress-num"><span id="selectedCount">0</span> / 15</div></div><div style="text-align:right;"><div class="label">Status</div><div id="quizStatus" style="font-size:0.9rem;font-weight:700;">In progress</div></div></div>
<div id="quiz"></div>
<div class="bottom-bar"><button class="btn btn-secondary" onclick="resetQuiz()">🔄 Reset</button><button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()" disabled>Submit all</button></div>
<footer><p><a href="sample-test-5a.html">← Test A</a> · <a href="module-5-crash-course.html">Crash Course</a> · <a href="index.html">Hub</a></p></footer>
</div>
<script>
const QUESTIONS = [
  { skill:"Median", q:`<p>Find the median of: <b>8, 14, 14, 17, 22, 25, 28, 35</b>.</p>`, choices:["19.5", "17", "22", "20.5"], ans:0, sol:"8 values (even count). Median = average of 4th and 5th = (17 + 22)/2 = 19.5." },
  { skill:"Q3", q:`<p>Find Q3 (upper quartile) of: <b>6, 9, 12, 12, 15, 18, 21, 24</b>.</p>`, choices:["18", "19.5", "21", "13.5"], ans:1, sol:"n = 8; median = (12+15)/2 = 13.5 splits into halves. Upper half: 15, 18, 21, 24. Q3 = median of upper = (18+21)/2 = 19.5." },
  { skill:"Plots", q:`<p>What's a key difference between a dot plot and a histogram?</p>`, choices:["Dot plots can't show distribution", "Histograms only work for small datasets", "Dot plots show every individual value; histograms group values into intervals (bars)", "They are the same thing"], ans:2, sol:"Dot plots = one dot per value. Histograms = bars over intervals (binned data)." },
  { skill:"Compare", q:`<p>Two box plots: Plot A has median 50, IQR 15. Plot B has median 45, IQR 30. Which has more variability?</p>`, choices:["A — larger median", "B — larger median", "A — smaller IQR means more variability", "B — larger IQR means more variability"], ans:3, sol:"More variability = larger IQR. B's IQR is 30 (vs A's 15) → B is more spread." },
  { skill:"Mean vs median", q:`<p>A data set is roughly symmetric with no outliers. Which is the better measure of center?</p>`, choices:["Mean — uses every value, symmetric data has no distortion", "Median — always safer", "Mode", "Range"], ans:0, sol:"For symmetric data with no outliers, the mean uses all values and is appropriate. (Skewed/outlier data → median.)" },
  { skill:"Outlier", q:`<p>Q1 = 5, Q3 = 17, IQR = 12. Using 1.5·IQR, lower fence is what?</p>`, choices:["−18", "−13", "1", "−7"], ans:1, sol:"Lower fence = Q1 − 1.5·IQR = 5 − 18 = −13. Values below −13 are outliers." },
  { skill:"Outlier effect", q:`<p>Removing a HIGH outlier from a data set affects the median how much?</p>`, choices:["Median drops dramatically", "Median rises dramatically", "Median changes very little (it's resistant)", "Median always doubles"], ans:2, sol:"Median is RESISTANT to outliers — removing one barely shifts it. The mean, in contrast, would decrease noticeably." },
  { skill:"Joint freq", q:`<p>In a two-way table with 200 total respondents, 30 people are both vegetarian and own a dog. What is the joint relative frequency of vegetarian + dog owner?</p>`, choices:["0.15", "0.30", "30", "Can't tell without more info"], ans:0, sol:"Joint relative frequency = cell / grand total = 30/200 = 0.15 (or 15%)." },
  { skill:"Column conditional", q:`<p>Of customers who chose coffee (column total = 80), 20 added cream. What fraction of coffee drinkers added cream?</p>`, choices:["0.25", "0.20", "0.40", "0.80"], ans:0, sol:"\"Of coffee drinkers\" → divide by column total: 20 / 80 = 0.25." },
  { skill:"y-intercept", q:`<p>For y = 5x + 200 where y = monthly bill in dollars and x = months, what does the 200 mean?</p>`, choices:["Total cost", "The starting / initial cost (when x = 0)", "Cost per month", "Tax amount"], ans:1, sol:"y-intercept = value at x = 0 = starting/initial amount. Here: $200 starting/fixed cost. The 5 is cost per month." },
  { skill:"Predict", q:`<p>Line of best fit: y = 2x + 5. Predict y when x = 12.</p>`, choices:["29", "24", "17", "31"], ans:0, sol:"y = 2(12) + 5 = 29." },
  { skill:"r value", q:`<p>A scatter plot shows points loosely clustered around a line sloping downward. Which is the best r value?</p>`, choices:["+0.95", "−0.95", "−0.55", "0"], ans:2, sol:"Downward slope → negative r. Loosely clustered → moderate magnitude. −0.55 fits (moderate negative). −0.95 would be tighter clustering." },
  { skill:"Causation", q:`<p>Which scenario describes CAUSATION rather than just correlation?</p>`, choices:["More umbrella sales correlate with more rain", "Hours studied directly causes higher test scores when method is controlled", "Shoe size correlates with reading ability", "Ice cream sales correlate with crime rate"], ans:1, sol:"Causation requires a controlled / direct mechanism. The other three are confounded: rain causes both umbrella sales AND wet ground; shoe size correlates with reading because both grow with age." },
  { skill:"Slope context", q:`<p>For y = 3x + 12 where y = total fee ($) and x = hours worked, what does the slope 3 represent?</p>`, choices:["Total fee", "Cost rises $3 per hour worked", "Fixed cost", "Number of hours"], ans:1, sol:"Slope = rate of change in context: $3 per hour worked. (12 is the fixed/starting fee.)" },
  { skill:"LOBF", q:`<p>Two points on a line of best fit: (3, 8) and (8, 23). What's the slope?</p>`, choices:["3", "5", "0.33", "15"], ans:0, sol:"Slope = (23 − 8)/(8 − 3) = 15/5 = 3." }
];
let userAnswers = new Array(QUESTIONS.length).fill(null);let submitted = false;
function render(){const e=document.getElementById('quiz');let h='';QUESTIONS.forEach((q,i)=>{let c='q-card';if(submitted)c+=userAnswers[i]===q.ans?' correct':' wrong';h+=`<div class="${c}"><div class="q-num">Question ${i+1} of ${QUESTIONS.length}<span class="skill-tag">${q.skill}</span></div><div class="q-text">${q.q}</div><div class="choices">`;q.choices.forEach((ch,j)=>{let cc='choice';if(submitted){cc+=' disabled';if(j===q.ans)cc+=' show-correct';else if(userAnswers[i]===j)cc+=' show-wrong';}else if(userAnswers[i]===j)cc+=' selected';h+=`<label class="${cc}"><input type="radio" name="q${i}" value="${j}" ${userAnswers[i]===j?'checked':''} ${submitted?'disabled':''} onchange="selectAnswer(${i},${j})"><span><span class="letter">${'ABCD'[j]}.</span> ${ch}</span></label>`;});h+=`</div>`;if(submitted)h+=`<div class="solution"><div class="sol-head">${userAnswers[i]===q.ans?'✓ Correct':'✗ Correct answer: '+'ABCD'[q.ans]}</div>${q.sol}</div>`;h+=`</div>`;});e.innerHTML=h;updateScoreBar();}
function updateScoreBar(){const s=userAnswers.filter(a=>a!==null).length;document.getElementById('selectedCount').textContent=s;document.getElementById('quizStatus').textContent=submitted?'Submitted':(s===QUESTIONS.length?'Ready to submit':'In progress');document.getElementById('submitBtn').disabled=submitted||s<QUESTIONS.length;}
function selectAnswer(i,j){if(submitted)return;userAnswers[i]=j;render();}
function submitQuiz(){if(submitted)return;if(userAnswers.includes(null)&&!confirm("You haven't answered every question. Submit anyway?"))return;submitted=true;render();showResults();}
function showResults(){const c=userAnswers.filter((a,i)=>a===QUESTIONS[i].ans).length;const t=QUESTIONS.length;const p=Math.round(c/t*100);const pass=p>=80;const b=document.createElement('div');b.className='result-banner '+(pass?'pass':'fail');b.innerHTML=`<h2>${pass?'🎯 Ready for the final':'📚 Keep drilling'}</h2><div class="big-score">${c} / ${t} <span style="font-size:1.5rem;">(${p}%)</span></div>`;document.querySelector('.score-bar').after(b);window.scrollTo({top:b.offsetTop-20,behavior:'smooth'});}
function resetQuiz(){if(!confirm("Clear answers and start over?"))return;userAnswers=new Array(QUESTIONS.length).fill(null);submitted=false;document.querySelectorAll('.result-banner').forEach(e=>e.remove());render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script></body></html>
