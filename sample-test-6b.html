<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Module 6 Sample Test B — Polynomial Operations</title>
<style>*{box-sizing:border-box;}:root{--bg:#0F172A;--bg-card:#1E293B;--bg-elevated:#334155;--text:#F1F5F9;--text-dim:#94A3B8;--primary:#14B8A6;--primary-2:#2563EB;--green:#10B981;--green-soft:rgba(16,185,129,0.18);--red:#EF4444;--red-soft:rgba(239,68,68,0.18);--border:#334155;}@media (prefers-color-scheme:light){:root{--bg:#F8FAFC;--bg-card:#FFFFFF;--bg-elevated:#F1F5F9;--text:#1A1A1A;--text-dim:#64748B;--border:#E2E8F0;}}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;}.container{max-width:760px;margin:0 auto;padding:1rem 1.1rem 4rem;}header.top{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1rem;}.logo{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#14B8A6,#2563EB);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}.back{color:var(--text-dim);text-decoration:none;font-size:0.88rem;font-weight:600;}.hero{background:linear-gradient(135deg,#14B8A6,#2563EB);border-radius:18px;padding:1.2rem 1.3rem;color:white;margin-bottom:1.3rem;}.hero h1{margin:0 0 0.3rem;font-size:1.3rem;font-weight:800;}.hero p{margin:0;font-size:0.92rem;opacity:0.95;line-height:1.55;}.hero .tags{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap;}.hero .tag{background:rgba(255,255,255,0.22);padding:0.25rem 0.7rem;border-radius:999px;font-weight:700;font-size:0.78rem;}.score-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:0.85rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;}.score-bar .label{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;}.score-bar .progress-num{font-size:1.4rem;font-weight:800;color:var(--primary);}.q-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:1rem;}.q-card.correct{border-color:var(--green);background:linear-gradient(180deg,var(--green-soft),var(--bg-card));}.q-card.wrong{border-color:var(--red);background:linear-gradient(180deg,var(--red-soft),var(--bg-card));}.q-num{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;margin-bottom:0.3rem;}.skill-tag{display:inline-block;font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;background:rgba(20,184,166,0.18);color:var(--primary);padding:0.1rem 0.45rem;border-radius:4px;margin-left:0.4rem;}.q-text{font-size:1.04rem;font-weight:600;margin-bottom:0.7rem;line-height:1.55;}.q-text sup,.choice sup,.solution sup{font-size:0.72em;}.choices{display:flex;flex-direction:column;gap:0.45rem;}.choice{display:flex;align-items:flex-start;gap:0.65rem;background:var(--bg-elevated);border:2px solid transparent;border-radius:10px;padding:0.7rem 0.9rem;cursor:pointer;font-size:0.95rem;line-height:1.5;}.choice:hover{border-color:var(--primary);}.choice input{margin-top:0.3rem;accent-color:var(--primary);}.choice .letter{font-weight:800;color:var(--text-dim);margin-right:0.2rem;}.choice.selected{border-color:var(--primary);background:rgba(20,184,166,0.12);}.choice.disabled{cursor:not-allowed;opacity:0.85;}.choice.disabled.selected{border-color:var(--primary);}.choice.show-correct{border-color:var(--green);background:var(--green-soft);}.choice.show-wrong{border-color:var(--red);background:var(--red-soft);}.solution{margin-top:0.7rem;padding:0.75rem 1rem;background:var(--bg-elevated);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-size:0.9rem;line-height:1.55;}.solution .sol-head{font-weight:800;color:var(--primary);margin-bottom:0.25rem;}.bottom-bar{display:flex;gap:0.55rem;margin-top:1.5rem;}.btn{flex:1;border:none;border-radius:12px;cursor:pointer;font-family:inherit;padding:0.95rem;font-size:1rem;font-weight:800;}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;}.btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}.btn:disabled{opacity:0.5;cursor:not-allowed;}.result-banner{background:linear-gradient(135deg,rgba(20,184,166,0.15),rgba(37,99,235,0.1));border:1px solid var(--primary);border-radius:14px;padding:1.1rem 1.3rem;margin:1.5rem 0;}.result-banner.pass{background:linear-gradient(135deg,rgba(16,185,129,0.18),rgba(37,99,235,0.1));border-color:var(--green);}.result-banner.fail{background:linear-gradient(135deg,rgba(239,68,68,0.18),rgba(245,158,11,0.1));border-color:var(--red);}.result-banner h2{margin:0 0 0.3rem;font-size:1.3rem;color:var(--primary);}.result-banner.pass h2{color:var(--green);}.result-banner.fail h2{color:var(--red);}.result-banner .big-score{font-size:3rem;font-weight:900;margin:0.3rem 0;line-height:1;}.result-banner.pass .big-score{color:var(--green);}.result-banner.fail .big-score{color:var(--red);}footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);text-align:center;font-size:0.83rem;color:var(--text-dim);}footer a{color:var(--primary);text-decoration:none;}</style>
</head><body><div class="container">
<header class="top"><a class="logo" href="index.html">🧮 Mod 6 Test B</a><a class="back" href="index.html">← Hub</a></header>
<div class="hero"><h1>Module 6 Sample Test B — Polynomial Operations</h1><p>Second mock test on Module 6 patterns.</p><div class="tags"><span class="tag">15 MC</span><span class="tag">~25 min</span><span class="tag">Final prep</span></div></div>
<div class="score-bar"><div><div class="label">Selected</div><div class="progress-num"><span id="selectedCount">0</span> / 15</div></div><div style="text-align:right;"><div class="label">Status</div><div id="quizStatus" style="font-size:0.9rem;font-weight:700;">In progress</div></div></div>
<div id="quiz"></div>
<div class="bottom-bar"><button class="btn btn-secondary" onclick="resetQuiz()">🔄 Reset</button><button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()" disabled>Submit all</button></div>
<footer><p><a href="sample-test-6a.html">← Test A</a> · <a href="module-6-crash-course.html">Crash Course</a> · <a href="index.html">Hub</a></p></footer>
</div>
<script>
const QUESTIONS = [
  { skill:"Classify", q:`<p>Classify <code>4x<sup>3</sup> − 2x + 7</code>.</p>`, choices:["Cubic trinomial", "Quadratic trinomial", "Cubic binomial", "Linear trinomial"], ans:0, sol:"Highest power 3 = cubic. 3 terms = trinomial." },
  { skill:"Standard form", q:`<p>Write in standard form: <code>5x − 3x<sup>2</sup> + x<sup>4</sup></code></p>`, choices:["5x − 3x<sup>2</sup> + x<sup>4</sup>", "x<sup>4</sup> − 3x<sup>2</sup> + 5x", "−3x<sup>2</sup> + x<sup>4</sup> + 5x", "x<sup>4</sup> + 5x − 3x<sup>2</sup>"], ans:1, sol:"Descending: degree 4, 2, 1 → x<sup>4</sup> − 3x<sup>2</sup> + 5x." },
  { skill:"Sum", q:`<p>Simplify: <code>(5x<sup>3</sup> + 2x − 8) + (−3x<sup>3</sup> + 4)</code></p>`, choices:["8x<sup>3</sup> + 2x + 4", "2x<sup>3</sup> + 2x − 12", "2x<sup>3</sup> + 2x − 4", "8x<sup>3</sup> + 2x − 4"], ans:2, sol:"x³: 5−3 = 2. x: 2. Const: −8+4 = −4." },
  { skill:"Difference", q:`<p>Simplify: <code>(6x<sup>2</sup> + 3x) − (2x<sup>2</sup> − 5x + 1)</code></p>`, choices:["8x<sup>2</sup> + 8x + 1", "4x<sup>2</sup> − 2x − 1", "4x<sup>2</sup> + 8x − 1", "4x<sup>2</sup> − 8x − 1"], ans:2, sol:"Distribute minus: 6x² + 3x − 2x² + 5x − 1. x²: 6−2 = 4; x: 3+5 = 8; const: −1." },
  { skill:"Closure (mult)", q:`<p>Polynomials are closed under which operations?</p>`, choices:["Addition only", "Add, subtract, multiply (but not divide)", "All four operations", "Multiplication and division only"], ans:1, sol:"Polynomials are closed under +, −, ×. Division can create variables in denominators (e.g., (x+1)/(x−2)), which aren't polynomials." },
  { skill:"Product rule", q:`<p>Simplify: <code>(2x)(7y)</code></p>`, choices:["9xy", "14xy", "14x<sup>2</sup>y<sup>2</sup>", "14xy<sup>2</sup>"], ans:1, sol:"Multiply coefficients 2·7 = 14. Different variables stay separate." },
  { skill:"Power of a product", q:`<p>Simplify: <code>(3xy<sup>2</sup>)<sup>2</sup></code></p>`, choices:["3x<sup>2</sup>y<sup>4</sup>", "6x<sup>2</sup>y<sup>4</sup>", "9xy<sup>4</sup>", "9x<sup>2</sup>y<sup>4</sup>"], ans:3, sol:"Apply 2 to each: 3² = 9, x², (y²)² = y⁴." },
  { skill:"Negative exponent", q:`<p>Simplify: <code>3a<sup>−2</sup>b</code></p>`, choices:["3a<sup>2</sup>b", "3b/a<sup>2</sup>", "−3a<sup>2</sup>b", "b/(3a<sup>2</sup>)"], ans:1, sol:"a<sup>−2</sup> = 1/a². So 3a<sup>−2</sup>b = 3b / a²." },
  { skill:"Quotient rule", q:`<p>Simplify: <code>12x<sup>4</sup> / (4x)</code></p>`, choices:["3x<sup>3</sup>", "3x<sup>4</sup>", "8x<sup>3</sup>", "3x<sup>5</sup>"], ans:0, sol:"Divide coefficients 12/4 = 3. Subtract exponents x^(4−1) = x³." },
  { skill:"Distribute monomial", q:`<p>Simplify: <code>2x(x<sup>2</sup> + 3x − 5)</code></p>`, choices:["2x<sup>3</sup> + 5x<sup>2</sup> − 5x", "2x<sup>3</sup> + 6x<sup>2</sup> − 10x", "2x<sup>3</sup> + 3x<sup>2</sup> − 10x", "2x<sup>2</sup> + 6x<sup>2</sup> − 10x"], ans:1, sol:"2x · x² = 2x³; 2x · 3x = 6x²; 2x · (−5) = −10x." },
  { skill:"FOIL", q:`<p>Multiply: <code>(2x − 1)(x + 5)</code></p>`, choices:["2x<sup>2</sup> + 9x − 5", "2x<sup>2</sup> − 9x − 5", "2x<sup>2</sup> + 11x − 5", "2x<sup>2</sup> + 9x + 5"], ans:0, sol:"2x·x + 2x·5 + (−1)·x + (−1)·5 = 2x² + 10x − x − 5 = 2x² + 9x − 5." },
  { skill:"Perfect square", q:`<p>Expand: <code>(x + 6)<sup>2</sup></code></p>`, choices:["x<sup>2</sup> + 36", "x<sup>2</sup> + 6x + 36", "x<sup>2</sup> − 12x + 36", "x<sup>2</sup> + 12x + 36"], ans:3, sol:"(a + b)² = a² + 2ab + b² = x² + 12x + 36." },
  { skill:"Diff of squares", q:`<p>Multiply: <code>(4x − 3)(4x + 3)</code></p>`, choices:["16x<sup>2</sup> − 9", "16x<sup>2</sup> + 9", "16x<sup>2</sup> − 24x + 9", "8x<sup>2</sup> − 9"], ans:0, sol:"Diff of squares: (4x)² − 3² = 16x² − 9." },
  { skill:"Composite numeric", q:`<p>f(x) = 2x<sup>2</sup> − 1, g(x) = x + 2. Find f(g(3)).</p>`, choices:["17", "49", "25", "11"], ans:1, sol:"g(3) = 5. f(5) = 2(25) − 1 = 49." },
  { skill:"Composite word", q:`<p>A jacket is 25% off: c(p) = 0.75p. Then 10% tax: t(c) = 1.10c. Find the final price as a function of original price p.</p>`, choices:["t[c(p)] = 0.85p", "t[c(p)] = 0.85p<sup>2</sup>", "t[c(p)] = 0.825p", "c[t(p)] = 1.65p"], ans:2, sol:"Discount first, then tax: t[c(p)] = 1.10 · (0.75p) = 0.825p." }
];
let userAnswers = new Array(QUESTIONS.length).fill(null);let submitted = false;
function render(){const e=document.getElementById('quiz');let h='';QUESTIONS.forEach((q,i)=>{let c='q-card';if(submitted)c+=userAnswers[i]===q.ans?' correct':' wrong';h+=`<div class="${c}"><div class="q-num">Question ${i+1} of ${QUESTIONS.length}<span class="skill-tag">${q.skill}</span></div><div class="q-text">${q.q}</div><div class="choices">`;q.choices.forEach((ch,j)=>{let cc='choice';if(submitted){cc+=' disabled';if(j===q.ans)cc+=' show-correct';else if(userAnswers[i]===j)cc+=' show-wrong';}else if(userAnswers[i]===j)cc+=' selected';h+=`<label class="${cc}"><input type="radio" name="q${i}" value="${j}" ${userAnswers[i]===j?'checked':''} ${submitted?'disabled':''} onchange="selectAnswer(${i},${j})"><span><span class="letter">${'ABCD'[j]}.</span> ${ch}</span></label>`;});h+=`</div>`;if(submitted)h+=`<div class="solution"><div class="sol-head">${userAnswers[i]===q.ans?'✓ Correct':'✗ Correct answer: '+'ABCD'[q.ans]}</div>${q.sol}</div>`;h+=`</div>`;});e.innerHTML=h;updateScoreBar();}
function updateScoreBar(){const s=userAnswers.filter(a=>a!==null).length;document.getElementById('selectedCount').textContent=s;document.getElementById('quizStatus').textContent=submitted?'Submitted':(s===QUESTIONS.length?'Ready to submit':'In progress');document.getElementById('submitBtn').disabled=submitted||s<QUESTIONS.length;}
function selectAnswer(i,j){if(submitted)return;userAnswers[i]=j;render();}
function submitQuiz(){if(submitted)return;if(userAnswers.includes(null)&&!confirm("You haven't answered every question. Submit anyway?"))return;submitted=true;render();showResults();}
function showResults(){const c=userAnswers.filter((a,i)=>a===QUESTIONS[i].ans).length;const t=QUESTIONS.length;const p=Math.round(c/t*100);const pass=p>=80;const b=document.createElement('div');b.className='result-banner '+(pass?'pass':'fail');b.innerHTML=`<h2>${pass?'🎯 Ready for the final':'📚 Keep drilling'}</h2><div class="big-score">${c} / ${t} <span style="font-size:1.5rem;">(${p}%)</span></div>`;document.querySelector('.score-bar').after(b);window.scrollTo({top:b.offsetTop-20,behavior:'smooth'});}
function resetQuiz(){if(!confirm("Clear answers and start over?"))return;userAnswers=new Array(QUESTIONS.length).fill(null);submitted=false;document.querySelectorAll('.result-banner').forEach(e=>e.remove());render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script></body></html>
