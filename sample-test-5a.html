<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Module 5 Sample Test A — Statistics</title>
<style>*{box-sizing:border-box;}:root{--bg:#0F172A;--bg-card:#1E293B;--bg-elevated:#334155;--text:#F1F5F9;--text-dim:#94A3B8;--primary:#3B82F6;--primary-2:#06B6D4;--green:#10B981;--green-soft:rgba(16,185,129,0.18);--red:#EF4444;--red-soft:rgba(239,68,68,0.18);--border:#334155;}@media (prefers-color-scheme:light){:root{--bg:#F8FAFC;--bg-card:#FFFFFF;--bg-elevated:#F1F5F9;--text:#1A1A1A;--text-dim:#64748B;--border:#E2E8F0;}}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;}.container{max-width:760px;margin:0 auto;padding:1rem 1.1rem 4rem;}header.top{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1rem;}.logo{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#3B82F6,#06B6D4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}.back{color:var(--text-dim);text-decoration:none;font-size:0.88rem;font-weight:600;}.hero{background:linear-gradient(135deg,#3B82F6,#06B6D4);border-radius:18px;padding:1.2rem 1.3rem;color:white;margin-bottom:1.3rem;}.hero h1{margin:0 0 0.3rem;font-size:1.3rem;font-weight:800;}.hero p{margin:0;font-size:0.92rem;opacity:0.95;line-height:1.55;}.hero .tags{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap;}.hero .tag{background:rgba(255,255,255,0.22);padding:0.25rem 0.7rem;border-radius:999px;font-weight:700;font-size:0.78rem;}.score-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:0.85rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;}.score-bar .label{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;}.score-bar .progress-num{font-size:1.4rem;font-weight:800;color:var(--primary);}.q-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:1rem;}.q-card.correct{border-color:var(--green);background:linear-gradient(180deg,var(--green-soft),var(--bg-card));}.q-card.wrong{border-color:var(--red);background:linear-gradient(180deg,var(--red-soft),var(--bg-card));}.q-num{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;margin-bottom:0.3rem;}.skill-tag{display:inline-block;font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;background:rgba(59,130,246,0.18);color:var(--primary);padding:0.1rem 0.45rem;border-radius:4px;margin-left:0.4rem;}.q-text{font-size:1.04rem;font-weight:600;margin-bottom:0.7rem;line-height:1.55;}.q-text sup,.choice sup,.solution sup{font-size:0.72em;}.q-text table{border-collapse:collapse;width:100%;margin:0.4rem 0;font-size:0.88rem;}.q-text th,.q-text td{border:1px solid var(--border);padding:0.3rem 0.5rem;text-align:center;}.q-text th{background:var(--bg-elevated);font-weight:700;}.choices{display:flex;flex-direction:column;gap:0.45rem;}.choice{display:flex;align-items:flex-start;gap:0.65rem;background:var(--bg-elevated);border:2px solid transparent;border-radius:10px;padding:0.7rem 0.9rem;cursor:pointer;font-size:0.95rem;line-height:1.5;}.choice:hover{border-color:var(--primary);}.choice input{margin-top:0.3rem;accent-color:var(--primary);}.choice .letter{font-weight:800;color:var(--text-dim);margin-right:0.2rem;}.choice.selected{border-color:var(--primary);background:rgba(59,130,246,0.12);}.choice.disabled{cursor:not-allowed;opacity:0.85;}.choice.disabled.selected{border-color:var(--primary);}.choice.show-correct{border-color:var(--green);background:var(--green-soft);}.choice.show-wrong{border-color:var(--red);background:var(--red-soft);}.solution{margin-top:0.7rem;padding:0.75rem 1rem;background:var(--bg-elevated);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-size:0.9rem;line-height:1.55;}.solution .sol-head{font-weight:800;color:var(--primary);margin-bottom:0.25rem;}.bottom-bar{display:flex;gap:0.55rem;margin-top:1.5rem;}.btn{flex:1;border:none;border-radius:12px;cursor:pointer;font-family:inherit;padding:0.95rem;font-size:1rem;font-weight:800;}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;}.btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}.btn:disabled{opacity:0.5;cursor:not-allowed;}.result-banner{background:linear-gradient(135deg,rgba(59,130,246,0.15),rgba(6,182,212,0.1));border:1px solid var(--primary);border-radius:14px;padding:1.1rem 1.3rem;margin:1.5rem 0;}.result-banner.pass{background:linear-gradient(135deg,rgba(16,185,129,0.18),rgba(6,182,212,0.1));border-color:var(--green);}.result-banner.fail{background:linear-gradient(135deg,rgba(239,68,68,0.18),rgba(245,158,11,0.1));border-color:var(--red);}.result-banner h2{margin:0 0 0.3rem;font-size:1.3rem;color:var(--primary);}.result-banner.pass h2{color:var(--green);}.result-banner.fail h2{color:var(--red);}.result-banner .big-score{font-size:3rem;font-weight:900;margin:0.3rem 0;line-height:1;}.result-banner.pass .big-score{color:var(--green);}.result-banner.fail .big-score{color:var(--red);}footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);text-align:center;font-size:0.83rem;color:var(--text-dim);}footer a{color:var(--primary);text-decoration:none;}</style>
</head><body><div class="container">
<header class="top"><a class="logo" href="index.html">📊 Mod 5 Test A</a><a class="back" href="index.html">← Hub</a></header>
<div class="hero"><h1>Module 5 Sample Test A — Statistics</h1><p>15-question mock test on Module 5 (5.01–5.07).</p><div class="tags"><span class="tag">15 MC</span><span class="tag">~25 min</span><span class="tag">Final prep</span></div></div>
<div class="score-bar"><div><div class="label">Selected</div><div class="progress-num"><span id="selectedCount">0</span> / 15</div></div><div style="text-align:right;"><div class="label">Status</div><div id="quizStatus" style="font-size:0.9rem;font-weight:700;">In progress</div></div></div>
<div id="quiz"></div>
<div class="bottom-bar"><button class="btn btn-secondary" onclick="resetQuiz()">🔄 Reset</button><button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()" disabled>Submit all</button></div>
<footer><p><a href="sample-test-5b.html">Test B →</a> · <a href="module-5-crash-course.html">Crash Course</a> · <a href="index.html">Hub</a></p></footer>
</div>
<script>
const QUESTIONS = [
  { skill:"Median", q:`<p>Find the median of: <b>12, 15, 18, 18, 20, 22, 25, 25, 30</b>.</p>`, choices:["20", "18", "22", "21"], ans:0, sol:"9 values (sorted). Median = middle = 5th value = 20." },
  { skill:"IQR", q:`<p>A box plot has min = 4, Q1 = 7, median = 12, Q3 = 18, max = 25. What is the IQR?</p>`, choices:["21 (max − min)", "11 (Q3 − Q1)", "13 (max − Q3 + Q1)", "12 (median)"], ans:1, sol:"IQR = Q3 − Q1 = 18 − 7 = 11. ⚠ NOT max − min (that's range)." },
  { skill:"Box plot", q:`<p>A box plot displays which summary statistics?</p>`, choices:["Mean and standard deviation only", "Mean, median, mode, range", "The five-number summary: min, Q1, median, Q3, max", "Just the median and range"], ans:2, sol:"Box plots show the five-number summary." },
  { skill:"Compare data", q:`<p>Data set X has median 75, IQR 8. Data set Y has median 70, IQR 20. Which statement is true?</p>`, choices:["Y has higher center but less spread", "X and Y have the same center", "Y has lower center AND less spread", "X has higher center AND less spread"], ans:3, sol:"Center: X (75) &gt; Y (70). Spread: X (IQR 8) &lt; Y (IQR 20). So X is higher center, less spread." },
  { skill:"Mean vs median", q:`<p>A data set is strongly skewed right by a few large outliers. Which is the better measure of center?</p>`, choices:["Median, because it resists outliers", "Mean, because it uses every value", "Range, because it shows spread", "Mode, because it's the most common"], ans:0, sol:"For skewed data or data with outliers, use the median — it isn't distorted by extreme values." },
  { skill:"Outlier (1.5·IQR)", q:`<p>Q1 = 10, Q3 = 30, IQR = 20. Using the 1.5·IQR rule, which value would be an outlier?</p>`, choices:["55", "65", "5", "40"], ans:1, sol:"Upper fence = Q3 + 1.5·IQR = 30 + 30 = 60. Lower fence = Q1 − 1.5·IQR = 10 − 30 = −20. Outlier &gt; 60 or &lt; −20 → 65 qualifies." },
  { skill:"Outlier effect", q:`<p>You remove a LOW outlier from a data set. What happens to the mean?</p>`, choices:["Mean decreases", "Mean stays the same", "Mean increases", "Cannot be determined"], ans:2, sol:"Removing a value BELOW the mean pulls the average UP — the mean increases." },
  { skill:"Marginal freq", q:`<p>In a two-way table, the marginal frequency for a category is:</p>`, choices:["A single inner cell", "A cell divided by the grand total", "Always 1", "The row or column TOTAL"], ans:3, sol:"Marginal frequency = a row or column total. (Joint = single cell; conditional = cell divided by row/column total.)" },
  { skill:"Conditional", q:`<p>Of dog owners, 40 own cats and 60 do not. What percentage of dog owners also own cats?</p>`, choices:["40%", "60%", "67%", "100%"], ans:0, sol:"Row total (dog owners) = 100. Cat & dog cell = 40. 40/100 = 40%." },
  { skill:"Slope context", q:`<p>For a line of best fit y = 6x + 40 where y is cost in dollars and x is items, what does the slope 6 mean?</p>`, choices:["Total cost", "Cost rises $6 per additional item", "Starting cost", "Number of items"], ans:1, sol:"Slope = rate of change in context. Cost increases $6 for each additional item." },
  { skill:"Residual", q:`<p>For a data point (5, 20) and predicted value 18, what is the residual?</p>`, choices:["38", "20", "+2", "−2"], ans:2, sol:"Residual = actual − predicted = 20 − 18 = +2." },
  { skill:"Good fit", q:`<p>Which residual pattern indicates a GOOD line of best fit?</p>`, choices:["Residuals all positive", "Residuals all negative", "Residuals get larger as x increases", "Residuals scatter randomly around zero, summing to about 0"], ans:3, sol:"Good fit: residuals random with no pattern, sum ≈ 0. Systematic patterns or one-sided residuals = bad fit." },
  { skill:"r value", q:`<p>A scatter plot shows points clustered tightly around a line sloping upward. What is the most likely r value?</p>`, choices:["+0.95", "−0.95", "+0.10", "0"], ans:0, sol:"Strong upward trend → r close to +1. The +0.95 fits." },
  { skill:"Causation", q:`<p>Ice cream sales and drowning incidents are strongly correlated. What's the most likely explanation?</p>`, choices:["Ice cream causes drowning", "A confounding variable (hot weather) explains both — correlation, not causation", "Drowning causes more ice cream sales", "It's pure coincidence"], ans:1, sol:"Both rise in hot weather (people swim more AND buy more ice cream). Classic confounding — correlation ≠ causation." },
  { skill:"Avg rate of change", q:`<p>From a table: at hour 2, profit = $30. At hour 6, profit = $98. Average rate of change from hour 2 to hour 6?</p>`, choices:["$68", "$34 per hour", "$17 per hour", "$24.50 per hour"], ans:2, sol:"(Δy)/(Δx) = (98 − 30)/(6 − 2) = 68/4 = $17 per hour. ⚠ Must divide by Δx, and include units." }
];
let userAnswers = new Array(QUESTIONS.length).fill(null);let submitted = false;
function render(){const e=document.getElementById('quiz');let h='';QUESTIONS.forEach((q,i)=>{let c='q-card';if(submitted)c+=userAnswers[i]===q.ans?' correct':' wrong';h+=`<div class="${c}"><div class="q-num">Question ${i+1} of ${QUESTIONS.length}<span class="skill-tag">${q.skill}</span></div><div class="q-text">${q.q}</div><div class="choices">`;q.choices.forEach((ch,j)=>{let cc='choice';if(submitted){cc+=' disabled';if(j===q.ans)cc+=' show-correct';else if(userAnswers[i]===j)cc+=' show-wrong';}else if(userAnswers[i]===j)cc+=' selected';h+=`<label class="${cc}"><input type="radio" name="q${i}" value="${j}" ${userAnswers[i]===j?'checked':''} ${submitted?'disabled':''} onchange="selectAnswer(${i},${j})"><span><span class="letter">${'ABCD'[j]}.</span> ${ch}</span></label>`;});h+=`</div>`;if(submitted)h+=`<div class="solution"><div class="sol-head">${userAnswers[i]===q.ans?'✓ Correct':'✗ Correct answer: '+'ABCD'[q.ans]}</div>${q.sol}</div>`;h+=`</div>`;});e.innerHTML=h;updateScoreBar();}
function updateScoreBar(){const s=userAnswers.filter(a=>a!==null).length;document.getElementById('selectedCount').textContent=s;document.getElementById('quizStatus').textContent=submitted?'Submitted':(s===QUESTIONS.length?'Ready to submit':'In progress');document.getElementById('submitBtn').disabled=submitted||s<QUESTIONS.length;}
function selectAnswer(i,j){if(submitted)return;userAnswers[i]=j;render();}
function submitQuiz(){if(submitted)return;if(userAnswers.includes(null)&&!confirm("You haven't answered every question. Submit anyway?"))return;submitted=true;render();showResults();}
function showResults(){const c=userAnswers.filter((a,i)=>a===QUESTIONS[i].ans).length;const t=QUESTIONS.length;const p=Math.round(c/t*100);const pass=p>=80;const b=document.createElement('div');b.className='result-banner '+(pass?'pass':'fail');b.innerHTML=`<h2>${pass?'🎯 Ready for the final':'📚 Keep drilling'}</h2><div class="big-score">${c} / ${t} <span style="font-size:1.5rem;">(${p}%)</span></div>`;document.querySelector('.score-bar').after(b);window.scrollTo({top:b.offsetTop-20,behavior:'smooth'});}
function resetQuiz(){if(!confirm("Clear answers and start over?"))return;userAnswers=new Array(QUESTIONS.length).fill(null);submitted=false;document.querySelectorAll('.result-banner').forEach(e=>e.remove());render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script></body></html>
