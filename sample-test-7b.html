<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Module 7 Sample Test B — Factoring</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}:root{--bg:#0F172A;--bg-card:#1E293B;--bg-elevated:#334155;--text:#F1F5F9;--text-dim:#94A3B8;--primary:#F59E0B;--primary-2:#DC2626;--green:#10B981;--green-soft:rgba(16,185,129,0.18);--red:#EF4444;--red-soft:rgba(239,68,68,0.18);--border:#334155;}@media (prefers-color-scheme:light){:root{--bg:#F8FAFC;--bg-card:#FFFFFF;--bg-elevated:#F1F5F9;--text:#1A1A1A;--text-dim:#64748B;--border:#E2E8F0;}}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;}.container{max-width:760px;margin:0 auto;padding:1rem 1.1rem 4rem;}header.top{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1rem;}.logo{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#F59E0B,#DC2626);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}.back{color:var(--text-dim);text-decoration:none;font-size:0.88rem;font-weight:600;}.hero{background:linear-gradient(135deg,#F59E0B,#DC2626);border-radius:18px;padding:1.2rem 1.3rem;color:white;margin-bottom:1.3rem;}.hero h1{margin:0 0 0.3rem;font-size:1.3rem;font-weight:800;}.hero p{margin:0;font-size:0.92rem;opacity:0.95;line-height:1.55;}.hero .tags{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap;}.hero .tag{background:rgba(255,255,255,0.22);padding:0.25rem 0.7rem;border-radius:999px;font-weight:700;font-size:0.78rem;}.score-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:0.85rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;}.score-bar .label{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;}.score-bar .progress-num{font-size:1.4rem;font-weight:800;color:var(--primary);}.q-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:1rem;}.q-card.correct{border-color:var(--green);background:linear-gradient(180deg,var(--green-soft),var(--bg-card));}.q-card.wrong{border-color:var(--red);background:linear-gradient(180deg,var(--red-soft),var(--bg-card));}.q-num{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;margin-bottom:0.3rem;}.skill-tag{display:inline-block;font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;background:rgba(245,158,11,0.18);color:var(--primary);padding:0.1rem 0.45rem;border-radius:4px;margin-left:0.4rem;}.q-text{font-size:1.04rem;font-weight:600;margin-bottom:0.7rem;line-height:1.55;}.q-text sup,.choice sup,.solution sup{font-size:0.72em;}.choices{display:flex;flex-direction:column;gap:0.45rem;}.choice{display:flex;align-items:flex-start;gap:0.65rem;background:var(--bg-elevated);border:2px solid transparent;border-radius:10px;padding:0.7rem 0.9rem;cursor:pointer;font-size:0.95rem;line-height:1.5;transition:all 0.15s;}.choice:hover{border-color:var(--primary);}.choice input{margin-top:0.3rem;cursor:pointer;flex-shrink:0;accent-color:var(--primary);}.choice .letter{font-weight:800;color:var(--text-dim);margin-right:0.2rem;}.choice.selected{border-color:var(--primary);background:rgba(245,158,11,0.12);}.choice.disabled{cursor:not-allowed;opacity:0.85;}.choice.disabled.selected{border-color:var(--primary);}.choice.show-correct{border-color:var(--green);background:var(--green-soft);}.choice.show-wrong{border-color:var(--red);background:var(--red-soft);}.solution{margin-top:0.7rem;padding:0.75rem 1rem;background:var(--bg-elevated);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-size:0.9rem;line-height:1.55;}.solution .sol-head{font-weight:800;color:var(--primary);margin-bottom:0.25rem;}.bottom-bar{display:flex;gap:0.55rem;margin-top:1.5rem;}.btn{flex:1;border:none;border-radius:12px;cursor:pointer;font-family:inherit;padding:0.95rem;font-size:1rem;font-weight:800;}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;}.btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}.btn:disabled{opacity:0.5;cursor:not-allowed;}.result-banner{background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(220,38,38,0.1));border:1px solid var(--primary);border-radius:14px;padding:1.1rem 1.3rem;margin:1.5rem 0;}.result-banner.pass{background:linear-gradient(135deg,rgba(16,185,129,0.18),rgba(245,158,11,0.1));border-color:var(--green);}.result-banner.fail{background:linear-gradient(135deg,rgba(239,68,68,0.18),rgba(245,158,11,0.1));border-color:var(--red);}.result-banner h2{margin:0 0 0.3rem;font-size:1.3rem;color:var(--primary);}.result-banner.pass h2{color:var(--green);} .result-banner.fail h2{color:var(--red);}.result-banner .big-score{font-size:3rem;font-weight:900;margin:0.3rem 0;line-height:1;}.result-banner.pass .big-score{color:var(--green);} .result-banner.fail .big-score{color:var(--red);}footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);text-align:center;font-size:0.83rem;color:var(--text-dim);}footer a{color:var(--primary);text-decoration:none;}</style>
</head><body><div class="container">
<header class="top"><a class="logo" href="index.html">🧨 Mod 7 Test B</a><a class="back" href="index.html">← Hub</a></header>
<div class="hero"><h1>Module 7 Sample Test B — Factoring</h1><p>Second mock test on factoring + graphing polynomials. Take after Test A.</p><div class="tags"><span class="tag">15 MC</span><span class="tag">~25 min</span><span class="tag">Final prep</span></div></div>
<div class="score-bar"><div><div class="label">Selected</div><div class="progress-num"><span id="selectedCount">0</span> / 15</div></div><div style="text-align:right;"><div class="label">Status</div><div id="quizStatus" style="font-size:0.9rem;font-weight:700;">In progress</div></div></div>
<div id="quiz"></div>
<div class="bottom-bar"><button class="btn btn-secondary" onclick="resetQuiz()">🔄 Reset</button><button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()" disabled>Submit all</button></div>
<footer><p><a href="sample-test-7a.html">← Test A</a> · <a href="module-7-crash-course.html">Crash Course</a> · <a href="index.html">Hub</a></p></footer>
</div>
<script>
const QUESTIONS = [
  { skill:"GCF", q:`<p>Factor: <code>12x<sup>3</sup> + 18x</code></p>`, choices:["6(2x<sup>3</sup> + 3x)", "6x(2x<sup>2</sup> + 3)", "x(12x<sup>2</sup> + 18)", "2x(6x<sup>2</sup> + 9)"], ans:1, sol:"Coeff GCF 6, x lowest power 1 → 6x(2x² + 3)." },
  { skill:"GCF", q:`<p>Factor: <code>9a<sup>2</sup>b − 6ab<sup>2</sup> + 12a<sup>2</sup>b<sup>2</sup></code></p>`, choices:["3ab(3a − 2b + 4ab)", "3(3a<sup>2</sup>b − 2ab<sup>2</sup> + 4a<sup>2</sup>b<sup>2</sup>)", "ab(9a − 6b + 12ab)", "3ab(3a + 2b + 4ab)"], ans:0, sol:"GCF: 3 (coeff), a (lowest x), b (lowest y) → 3ab. Divide each: 9a²b/3ab = 3a; −6ab²/3ab = −2b; 12a²b²/3ab = 4ab." },
  { skill:"Grouping", q:`<p>Factor: <code>2x<sup>3</sup> − 8x<sup>2</sup> + 3x − 12</code></p>`, choices:["(2x − 3)(x − 4)", "(x − 4)(2x<sup>2</sup> + 3)", "(2x + 3)(x<sup>2</sup> − 4)", "(x + 4)(2x<sup>2</sup> − 3)"], ans:1, sol:"Group: 2x²(x − 4) + 3(x − 4) = (x − 4)(2x² + 3)." },
  { skill:"Trinomial (a=1)", q:`<p>Factor: <code>x<sup>2</sup> + 5x + 6</code></p>`, choices:["(x + 1)(x + 6)", "(x + 2)(x + 3)", "(x − 2)(x − 3)", "(x − 1)(x − 6)"], ans:1, sol:"Multiply to 6, add to 5 → 2 and 3." },
  { skill:"Trinomial (a=1)", q:`<p>Factor: <code>x<sup>2</sup> − 9x + 20</code></p>`, choices:["(x + 4)(x + 5)", "(x − 4)(x + 5)", "(x − 4)(x − 5)", "(x + 4)(x − 5)"], ans:2, sol:"Multiply to 20, add to −9 → both negative: −4 and −5." },
  { skill:"Trinomial (a=1)", q:`<p>Factor: <code>x<sup>2</sup> + x − 30</code></p>`, choices:["(x − 5)(x + 6)", "(x + 5)(x − 6)", "(x − 5)(x − 6)", "(x + 5)(x + 6)"], ans:0, sol:"Multiply to −30, add to +1 → +6 and −5 (positive wins because b &gt; 0)." },
  { skill:"Trinomial (a≠1)", q:`<p>Factor: <code>4x<sup>2</sup> + 4x − 3</code></p>`, choices:["(2x − 3)(2x + 1)", "(2x + 3)(2x − 1)", "(4x − 1)(x + 3)", "(4x + 3)(x − 1)"], ans:1, sol:"AC = −12. Numbers: +6 and −2 (sum 4). Split: 4x² + 6x − 2x − 3 → 2x(2x + 3) − 1(2x + 3) → (2x + 3)(2x − 1)." },
  { skill:"Trinomial (a≠1)", q:`<p>Factor: <code>6x<sup>2</sup> − 7x + 2</code></p>`, choices:["(3x − 2)(2x − 1)", "(6x − 1)(x − 2)", "(2x − 1)(3x + 2)", "(3x + 2)(2x − 1)"], ans:0, sol:"AC = 12. Numbers: −3 and −4 (sum −7). Split: 6x² − 3x − 4x + 2 → 3x(2x − 1) − 2(2x − 1) → (3x − 2)(2x − 1)." },
  { skill:"Difference of squares", q:`<p>Factor: <code>9x<sup>2</sup> − 16</code></p>`, choices:["(3x − 4)(3x + 4)", "(3x − 4)<sup>2</sup>", "(9x − 16)(9x + 16)", "Prime"], ans:0, sol:"9x² = (3x)², 16 = 4² → (3x − 4)(3x + 4)." },
  { skill:"Difference of squares", q:`<p>Factor: <code>25x<sup>2</sup> − 1</code></p>`, choices:["(25x − 1)(25x + 1)", "(5x − 1)(5x + 1)", "(5x − 1)<sup>2</sup>", "Prime"], ans:1, sol:"25x² = (5x)², 1 = 1² → (5x − 1)(5x + 1)." },
  { skill:"Combined", q:`<p>Factor completely: <code>2x<sup>2</sup> − 50</code></p>`, choices:["2(x − 25)(x + 25)", "(2x − 5)(2x + 5)", "2(x − 5)(x + 5)", "2(x<sup>2</sup> − 25)"], ans:2, sol:"GCF 2 → 2(x² − 25) → 2(x − 5)(x + 5). Don't stop at the unfactored form." },
  { skill:"Roots", q:`<p>Find the roots of <code>f(x) = x<sup>2</sup> − 4x − 12</code>.</p>`, choices:["x = −6 or x = 2", "x = 6 or x = −2", "x = 4 or x = −3", "x = 3 or x = −4"], ans:1, sol:"Factor: (x − 6)(x + 2) = 0 → x = 6 or x = −2." },
  { skill:"End behavior", q:`<p>Describe the end behavior of <code>f(x) = 4x<sup>4</sup> − 3x</code>.</p>`, choices:["Both ↑", "Both ↓", "Left ↑, right ↓", "Left ↓, right ↑"], ans:0, sol:"Even degree (4), positive leading coefficient → both ends UP." },
  { skill:"Multiplicity", q:`<p>For <code>f(x) = (x + 5)<sup>2</sup>(x − 2)<sup>3</sup></code>, how does the graph behave at the roots?</p>`, choices:["Crosses at x = −5; touches at x = 2", "Touches at x = −5; crosses at x = 2", "Crosses at both", "Touches at both"], ans:1, sol:"x = −5 multiplicity 2 (even) → TOUCHES. x = 2 multiplicity 3 (odd) → CROSSES." },
  { skill:"Combined", q:`<p>Factor completely: <code>4x<sup>3</sup> − 4x</code></p>`, choices:["4(x − 1)(x + 1)", "(2x − 2)(2x + 2)x", "4x(x<sup>2</sup> − 1)", "4x(x − 1)(x + 1)"], ans:3, sol:"GCF 4x → 4x(x² − 1) → 4x(x − 1)(x + 1)." }
];
let userAnswers = new Array(QUESTIONS.length).fill(null);let submitted = false;
function render(){const e=document.getElementById('quiz');let h='';QUESTIONS.forEach((q,i)=>{let c='q-card';if(submitted)c+=userAnswers[i]===q.ans?' correct':' wrong';h+=`<div class="${c}"><div class="q-num">Question ${i+1} of ${QUESTIONS.length}<span class="skill-tag">${q.skill}</span></div><div class="q-text">${q.q}</div><div class="choices">`;q.choices.forEach((ch,j)=>{let cc='choice';if(submitted){cc+=' disabled';if(j===q.ans)cc+=' show-correct';else if(userAnswers[i]===j)cc+=' show-wrong';}else if(userAnswers[i]===j)cc+=' selected';h+=`<label class="${cc}"><input type="radio" name="q${i}" value="${j}" ${userAnswers[i]===j?'checked':''} ${submitted?'disabled':''} onchange="selectAnswer(${i},${j})"><span><span class="letter">${'ABCD'[j]}.</span> ${ch}</span></label>`;});h+=`</div>`;if(submitted)h+=`<div class="solution"><div class="sol-head">${userAnswers[i]===q.ans?'✓ Correct':'✗ Correct answer: '+'ABCD'[q.ans]}</div>${q.sol}</div>`;h+=`</div>`;});e.innerHTML=h;updateScoreBar();}
function updateScoreBar(){const s=userAnswers.filter(a=>a!==null).length;document.getElementById('selectedCount').textContent=s;document.getElementById('quizStatus').textContent=submitted?'Submitted':(s===QUESTIONS.length?'Ready to submit':'In progress');document.getElementById('submitBtn').disabled=submitted||s<QUESTIONS.length;}
function selectAnswer(i,j){if(submitted)return;userAnswers[i]=j;render();}
function submitQuiz(){if(submitted)return;if(userAnswers.includes(null)&&!confirm("You haven't answered every question. Submit anyway?"))return;submitted=true;render();showResults();}
function showResults(){const c=userAnswers.filter((a,i)=>a===QUESTIONS[i].ans).length;const t=QUESTIONS.length;const p=Math.round(c/t*100);const pass=p>=80;const b=document.createElement('div');b.className='result-banner '+(pass?'pass':'fail');b.innerHTML=`<h2>${pass?'🎯 Ready for the final':'📚 Keep drilling'}</h2><div class="big-score">${c} / ${t} <span style="font-size:1.5rem;">(${p}%)</span></div>`;document.querySelector('.score-bar').after(b);window.scrollTo({top:b.offsetTop-20,behavior:'smooth'});}
function resetQuiz(){if(!confirm("Clear answers and start over?"))return;userAnswers=new Array(QUESTIONS.length).fill(null);submitted=false;document.querySelectorAll('.result-banner').forEach(e=>e.remove());render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script></body></html>
