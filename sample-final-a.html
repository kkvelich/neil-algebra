<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sample Final Exam A — Semester 2</title>
<style>*{box-sizing:border-box;}:root{--bg:#0F172A;--bg-card:#1E293B;--bg-elevated:#334155;--text:#F1F5F9;--text-dim:#94A3B8;--primary:#6366F1;--primary-2:#EC4899;--green:#10B981;--green-soft:rgba(16,185,129,0.18);--red:#EF4444;--red-soft:rgba(239,68,68,0.18);--border:#334155;}@media (prefers-color-scheme:light){:root{--bg:#F8FAFC;--bg-card:#FFFFFF;--bg-elevated:#F1F5F9;--text:#1A1A1A;--text-dim:#64748B;--border:#E2E8F0;}}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;}.container{max-width:760px;margin:0 auto;padding:1rem 1.1rem 4rem;}header.top{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1rem;}.logo{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#6366F1,#EC4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}.back{color:var(--text-dim);text-decoration:none;font-size:0.88rem;font-weight:600;}.hero{background:linear-gradient(135deg,#6366F1,#EC4899);border-radius:18px;padding:1.2rem 1.3rem;color:white;margin-bottom:1.3rem;}.hero h1{margin:0 0 0.3rem;font-size:1.3rem;font-weight:800;}.hero p{margin:0;font-size:0.92rem;opacity:0.95;line-height:1.55;}.hero .tags{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap;}.hero .tag{background:rgba(255,255,255,0.22);padding:0.25rem 0.7rem;border-radius:999px;font-weight:700;font-size:0.78rem;}.score-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:0.85rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;}.score-bar .label{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;}.score-bar .progress-num{font-size:1.4rem;font-weight:800;color:var(--primary);}.q-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:1rem;}.q-card.correct{border-color:var(--green);background:linear-gradient(180deg,var(--green-soft),var(--bg-card));}.q-card.wrong{border-color:var(--red);background:linear-gradient(180deg,var(--red-soft),var(--bg-card));}.q-num{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;margin-bottom:0.3rem;}.skill-tag{display:inline-block;font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;padding:0.1rem 0.45rem;border-radius:4px;margin-left:0.4rem;}.m5-tag{background:rgba(59,130,246,0.18);color:#60A5FA;}.m6-tag{background:rgba(20,184,166,0.18);color:#2DD4BF;}.m7-tag{background:rgba(245,158,11,0.18);color:#FBBF24;}.m8-tag{background:rgba(220,38,38,0.18);color:#F87171;}.q-text{font-size:1.04rem;font-weight:600;margin-bottom:0.7rem;line-height:1.55;}.q-text sup,.choice sup,.solution sup{font-size:0.72em;}.choices{display:flex;flex-direction:column;gap:0.45rem;}.choice{display:flex;align-items:flex-start;gap:0.65rem;background:var(--bg-elevated);border:2px solid transparent;border-radius:10px;padding:0.7rem 0.9rem;cursor:pointer;font-size:0.95rem;line-height:1.5;}.choice:hover{border-color:var(--primary);}.choice input{margin-top:0.3rem;accent-color:var(--primary);}.choice .letter{font-weight:800;color:var(--text-dim);margin-right:0.2rem;}.choice.selected{border-color:var(--primary);background:rgba(99,102,241,0.12);}.choice.disabled{cursor:not-allowed;opacity:0.85;}.choice.disabled.selected{border-color:var(--primary);}.choice.show-correct{border-color:var(--green);background:var(--green-soft);}.choice.show-wrong{border-color:var(--red);background:var(--red-soft);}.solution{margin-top:0.7rem;padding:0.75rem 1rem;background:var(--bg-elevated);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-size:0.9rem;line-height:1.55;}.solution .sol-head{font-weight:800;color:var(--primary);margin-bottom:0.25rem;}.bottom-bar{display:flex;gap:0.55rem;margin-top:1.5rem;}.btn{flex:1;border:none;border-radius:12px;cursor:pointer;font-family:inherit;padding:0.95rem;font-size:1rem;font-weight:800;}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;}.btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}.btn:disabled{opacity:0.5;cursor:not-allowed;}.result-banner{background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(236,72,153,0.1));border:1px solid var(--primary);border-radius:14px;padding:1.1rem 1.3rem;margin:1.5rem 0;}.result-banner.pass{background:linear-gradient(135deg,rgba(16,185,129,0.18),rgba(236,72,153,0.1));border-color:var(--green);}.result-banner.fail{background:linear-gradient(135deg,rgba(239,68,68,0.18),rgba(245,158,11,0.1));border-color:var(--red);}.result-banner h2{margin:0 0 0.3rem;font-size:1.3rem;color:var(--primary);}.result-banner.pass h2{color:var(--green);}.result-banner.fail h2{color:var(--red);}.result-banner .big-score{font-size:3rem;font-weight:900;margin:0.3rem 0;line-height:1;}.result-banner.pass .big-score{color:var(--green);}.result-banner.fail .big-score{color:var(--red);}.breakdown{margin-top:0.8rem;display:flex;flex-wrap:wrap;gap:0.5rem;font-size:0.85rem;}.breakdown span{padding:0.2rem 0.55rem;border-radius:4px;background:rgba(255,255,255,0.08);}footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);text-align:center;font-size:0.83rem;color:var(--text-dim);}footer a{color:var(--primary);text-decoration:none;}</style>
</head><body><div class="container">
<header class="top"><a class="logo" href="index.html">📘 Sample Final A</a><a class="back" href="index.html">← Hub</a></header>
<div class="hero"><h1>Sample Final Exam A</h1><p>25 questions across Modules 5/6/7/8, mock final format. Aim 20+/25 (80%). Pass bar on the real final is 60% (15/25 here).</p><div class="tags"><span class="tag">25 MC</span><span class="tag">~45 min</span><span class="tag">All 4 modules</span></div></div>
<div class="score-bar"><div><div class="label">Selected</div><div class="progress-num"><span id="selectedCount">0</span> / 25</div></div><div style="text-align:right;"><div class="label">Status</div><div id="quizStatus" style="font-size:0.9rem;font-weight:700;">In progress</div></div></div>
<div id="quiz"></div>
<div class="bottom-bar"><button class="btn btn-secondary" onclick="resetQuiz()">🔄 Reset</button><button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()" disabled>Submit all</button></div>
<footer><p><a href="sample-final-b.html">Sample Final B →</a> · <a href="final-exam-study-guide.html">Cheat Sheet</a> · <a href="index.html">Hub</a></p></footer>
</div>
<script>
const QUESTIONS = [
  // ===== MODULE 5 (5 Q) =====
  { mod:"m5", skill:"Median (5.01)", q:`<p>Find the median of: <b>8, 11, 14, 14, 17, 20, 22, 25, 28</b>.</p>`, choices:["17", "14", "18.78", "20"], ans:0, sol:"9 values (sorted). Median = middle = 5th value = 17." },
  { mod:"m5", skill:"IQR (5.01)", q:`<p>A box plot has Q1 = 12 and Q3 = 28. What is the IQR?</p>`, choices:["40", "20", "16", "12"], ans:2, sol:"IQR = Q3 − Q1 = 28 − 12 = 16. NOT max − min." },
  { mod:"m5", skill:"Conditional (5.05)", q:`<p>Of 50 dog owners surveyed, 30 also own a cat. What percentage of dog owners own a cat?</p>`, choices:["30%", "60%", "40%", "50%"], ans:1, sol:"\"Of dog owners\" → divide by dog row total: 30/50 = 0.60 = 60%." },
  { mod:"m5", skill:"r value (5.07)", q:`<p>A scatter plot shows points tightly clustered around a line sloping DOWNWARD. Which r value fits best?</p>`, choices:["+0.85", "−0.85", "0.10", "−0.10"], ans:1, sol:"Downward + tight clustering → strong negative → r close to −1. −0.85 fits." },
  { mod:"m5", skill:"Avg rate of change (5.07)", q:`<p>Profit at hour 2 = $15. Profit at hour 8 = $45. Average rate of change?</p>`, choices:["$30 per hour", "$5 per hour", "$30 total", "$7.50 per hour"], ans:1, sol:"(Δy)/(Δx) = (45 − 15)/(8 − 2) = 30/6 = $5 per hour. Don't forget to divide; include units." },
  // ===== MODULE 6 (6 Q) =====
  { mod:"m6", skill:"Classify (6.01)", q:`<p>Classify <code>4x<sup>3</sup> + 2x − 1</code> by degree and term count.</p>`, choices:["Cubic trinomial", "Quadratic trinomial", "Cubic binomial", "Linear trinomial"], ans:0, sol:"Degree 3 = cubic. 3 terms = trinomial." },
  { mod:"m6", skill:"Sum (6.02)", q:`<p>Simplify: <code>(3x<sup>2</sup> + 2x − 5) + (x<sup>2</sup> − x + 3)</code></p>`, choices:["3x<sup>2</sup> + x − 2", "4x<sup>2</sup> + x − 2", "4x<sup>2</sup> + 3x − 8", "4x<sup>2</sup> − x − 2"], ans:1, sol:"x²: 3+1=4. x: 2−1=1. Const: −5+3=−2." },
  { mod:"m6", skill:"Difference (6.02)", q:`<p>Simplify: <code>(5x<sup>2</sup> − 3x + 1) − (2x<sup>2</sup> + 4x − 2)</code></p>`, choices:["7x<sup>2</sup> + x − 1", "3x<sup>2</sup> + x − 1", "3x<sup>2</sup> − 7x + 3", "3x<sup>2</sup> − 7x − 1"], ans:2, sol:"Distribute minus: 5x² − 3x + 1 − 2x² − 4x + 2. x²: 5−2=3; x: −3−4=−7; const: 1+2=3." },
  { mod:"m6", skill:"Exponent rule (6.03)", q:`<p>Simplify: <code>(2x<sup>3</sup>y<sup>2</sup>)<sup>3</sup></code></p>`, choices:["8x<sup>9</sup>y<sup>6</sup>", "6x<sup>9</sup>y<sup>6</sup>", "2x<sup>9</sup>y<sup>6</sup>", "8x<sup>6</sup>y<sup>5</sup>"], ans:0, sol:"Apply 3 to each: 2³=8, (x³)³=x⁹, (y²)³=y⁶." },
  { mod:"m6", skill:"Diff of squares (6.04)", q:`<p>Multiply: <code>(x − 5)(x + 5)</code></p>`, choices:["x<sup>2</sup> − 10x + 25", "x<sup>2</sup> − 25", "x<sup>2</sup> + 25", "x<sup>2</sup> + 10x − 25"], ans:1, sol:"Diff of squares: x² − 5² = x² − 25. No middle term." },
  { mod:"m6", skill:"Composition (6.05)", q:`<p>f(x) = 2x − 1, g(x) = x<sup>2</sup>. Find f(g(3)).</p>`, choices:["17", "11", "35", "5"], ans:0, sol:"g(3) = 9. f(9) = 2(9) − 1 = 17." },
  // ===== MODULE 7 (6 Q) =====
  { mod:"m7", skill:"GCF (7.01)", q:`<p>Factor: <code>6x<sup>2</sup> + 9x</code></p>`, choices:["3(2x<sup>2</sup> + 3x)", "x(6x + 9)", "3x(2x + 3)", "3x(2x + 9)"], ans:2, sol:"GCF = 3x → 3x(2x + 3)." },
  { mod:"m7", skill:"Trinomial a=1 (7.03)", q:`<p>Factor: <code>x<sup>2</sup> + 3x − 10</code></p>`, choices:["(x − 5)(x + 2)", "(x + 5)(x + 2)", "(x − 5)(x − 2)", "(x + 5)(x − 2)"], ans:3, sol:"Multiply to −10, add to 3 → +5 and −2." },
  { mod:"m7", skill:"Trinomial a≠1 (7.03)", q:`<p>Factor: <code>2x<sup>2</sup> − 7x − 4</code></p>`, choices:["(2x + 1)(x − 4)", "(2x − 1)(x + 4)", "(2x + 4)(x − 1)", "(2x − 4)(x + 1)"], ans:0, sol:"AC = −8. Numbers: −8 and +1 (sum −7). Split: 2x² − 8x + x − 4 → 2x(x − 4) + 1(x − 4) → (2x + 1)(x − 4)." },
  { mod:"m7", skill:"DOS (7.04)", q:`<p>Factor: <code>x<sup>2</sup> − 64</code></p>`, choices:["(x − 8)(x + 8)", "(x − 8)<sup>2</sup>", "(x + 8)<sup>2</sup>", "Prime"], ans:0, sol:"64 = 8². Diff of squares: (x − 8)(x + 8)." },
  { mod:"m7", skill:"Grouping (7.02)", q:`<p>Factor: <code>x<sup>3</sup> + 2x<sup>2</sup> + 3x + 6</code></p>`, choices:["(x − 2)(x<sup>2</sup> + 3)", "(x + 3)(x<sup>2</sup> + 2)", "(x + 2)(x<sup>2</sup> + 3)", "(x + 6)(x<sup>2</sup> + 1)"], ans:2, sol:"Group: x²(x + 2) + 3(x + 2) = (x + 2)(x² + 3)." },
  { mod:"m7", skill:"Roots (7.05)", q:`<p>Find the roots of <code>f(x) = x<sup>2</sup> − 5x + 6</code>.</p>`, choices:["x = 2 or x = 3", "x = −2 or x = −3", "x = 6 or x = −1", "x = 5 or x = 6"], ans:0, sol:"Factor: (x − 2)(x − 3) = 0 → x = 2 or x = 3." },
  // ===== MODULE 8 (8 Q) =====
  { mod:"m8", skill:"Vertex (8.01)", q:`<p>Find the vertex of <code>f(x) = x<sup>2</sup> + 4x + 1</code>.</p>`, choices:["(−2, −3)", "(2, 13)", "(4, 1)", "(−2, 1)"], ans:0, sol:"x = −4/2 = −2. f(−2) = 4 − 8 + 1 = −3." },
  { mod:"m8", skill:"Axis (8.01)", q:`<p>Axis of symmetry of <code>f(x) = 3x<sup>2</sup> − 12x + 7</code>?</p>`, choices:["x = −2", "x = 2", "x = 12", "x = 4"], ans:1, sol:"x = −(−12)/(2·3) = 12/6 = 2." },
  { mod:"m8", skill:"Solve (factor) (8.03)", q:`<p>Solve <code>x<sup>2</sup> + 6x + 5 = 0</code>.</p>`, choices:["x = 1 or x = 5", "x = −1 or x = −5", "x = 6 or x = 5", "x = −6 or x = −5"], ans:1, sol:"(x + 1)(x + 5) = 0 → x = −1 or x = −5." },
  { mod:"m8", skill:"Square root (8.02)", q:`<p>Solve <code>x<sup>2</sup> = 50</code>.</p>`, choices:["x = 25", "x = ±25", "x = ±5√2", "x = ±√50 only"], ans:2, sol:"Take ±√: x = ±√50 = ±5√2 (simplified)." },
  { mod:"m8", skill:"Quadratic formula (8.03)", q:`<p>Solve <code>x<sup>2</sup> + 5x + 2 = 0</code>.</p>`, choices:["x = (−5 ± √17)/2", "x = (5 ± √17)/2", "x = (−5 ± √33)/2", "x = (−5 ± 17)/2"], ans:0, sol:"a=1, b=5, c=2. Disc = 25 − 8 = 17. x = (−5 ± √17)/2." },
  { mod:"m8", skill:"Discriminant (8.03)", q:`<p>How many real solutions does <code>2x<sup>2</sup> + x + 3 = 0</code> have?</p>`, choices:["2 distinct real", "1 real (double)", "0 real", "Cannot tell"], ans:2, sol:"Disc = 1 − 24 = −23 &lt; 0 → no real solutions." },
  { mod:"m8", skill:"Vertex form (8.02)", q:`<p>Write <code>x<sup>2</sup> − 4x − 7</code> in vertex form.</p>`, choices:["(x − 2)<sup>2</sup> − 3", "(x + 2)<sup>2</sup> − 11", "(x − 2)<sup>2</sup> − 11", "(x − 4)<sup>2</sup> − 23"], ans:2, sol:"Half of −4 = −2, squared = 4. x² − 4x + 4 − 4 − 7 = (x − 2)² − 11." },
  { mod:"m8", skill:"Projectile (8.04)", q:`<p>A ball: <code>h(t) = −16t<sup>2</sup> + 64t</code>. Maximum height?</p>`, choices:["64 feet", "32 feet", "96 feet", "16 feet"], ans:0, sol:"Vertex t = −64/(2·−16) = 2 sec. h(2) = −64 + 128 = 64 feet." }
];
let userAnswers = new Array(QUESTIONS.length).fill(null);let submitted = false;
function render(){const e=document.getElementById('quiz');let h='';QUESTIONS.forEach((q,i)=>{let c='q-card';if(submitted)c+=userAnswers[i]===q.ans?' correct':' wrong';h+=`<div class="${c}"><div class="q-num">Question ${i+1} of ${QUESTIONS.length}<span class="skill-tag ${q.mod}-tag">${q.skill}</span></div><div class="q-text">${q.q}</div><div class="choices">`;q.choices.forEach((ch,j)=>{let cc='choice';if(submitted){cc+=' disabled';if(j===q.ans)cc+=' show-correct';else if(userAnswers[i]===j)cc+=' show-wrong';}else if(userAnswers[i]===j)cc+=' selected';h+=`<label class="${cc}"><input type="radio" name="q${i}" value="${j}" ${userAnswers[i]===j?'checked':''} ${submitted?'disabled':''} onchange="selectAnswer(${i},${j})"><span><span class="letter">${'ABCD'[j]}.</span> ${ch}</span></label>`;});h+=`</div>`;if(submitted)h+=`<div class="solution"><div class="sol-head">${userAnswers[i]===q.ans?'✓ Correct':'✗ Correct answer: '+'ABCD'[q.ans]}</div>${q.sol}</div>`;h+=`</div>`;});e.innerHTML=h;updateScoreBar();}
function updateScoreBar(){const s=userAnswers.filter(a=>a!==null).length;document.getElementById('selectedCount').textContent=s;document.getElementById('quizStatus').textContent=submitted?'Submitted':(s===QUESTIONS.length?'Ready to submit':'In progress');document.getElementById('submitBtn').disabled=submitted||s<QUESTIONS.length;}
function selectAnswer(i,j){if(submitted)return;userAnswers[i]=j;render();}
function submitQuiz(){if(submitted)return;if(userAnswers.includes(null)&&!confirm("You haven't answered every question. Submit anyway?"))return;submitted=true;render();showResults();}
function showResults(){const correct=userAnswers.map((a,i)=>a===QUESTIONS[i].ans);const c=correct.filter(Boolean).length;const t=QUESTIONS.length;const p=Math.round(c/t*100);const pass=p>=60;const ace=p>=80;const mods={m5:[0,0],m6:[0,0],m7:[0,0],m8:[0,0]};QUESTIONS.forEach((q,i)=>{mods[q.mod][1]++;if(correct[i])mods[q.mod][0]++;});const b=document.createElement('div');b.className='result-banner '+(ace?'pass':(pass?'':'fail'));b.innerHTML=`<h2>${ace?'🎯 Solid — ready for the final':(pass?'✅ Above the 60% pass bar':'📚 Below the pass bar — drill more')}</h2><div class="big-score">${c} / ${t} <span style="font-size:1.5rem;">(${p}%)</span></div><div class="breakdown"><span>M5: ${mods.m5[0]}/${mods.m5[1]}</span><span>M6: ${mods.m6[0]}/${mods.m6[1]}</span><span>M7: ${mods.m7[0]}/${mods.m7[1]}</span><span>M8: ${mods.m8[0]}/${mods.m8[1]}</span></div>`;document.querySelector('.score-bar').after(b);window.scrollTo({top:b.offsetTop-20,behavior:'smooth'});}
function resetQuiz(){if(!confirm("Clear answers and start over?"))return;userAnswers=new Array(QUESTIONS.length).fill(null);submitted=false;document.querySelectorAll('.result-banner').forEach(e=>e.remove());render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script></body></html>
